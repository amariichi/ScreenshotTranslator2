name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax-smoke:
    name: syntax-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall app

      - name: Check shell syntax
        run: |
          bash -n start.sh
          for f in app/scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done
          bash -n gnome-extension/install.sh

      - name: Setup Node for GNOME extension syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check GNOME extension syntax and settings schema
        run: |
          node --input-type=module --check < gnome-extension/extension.js
          node --input-type=module --check < tests/gnome-extension-smoke.js
          glib-compile-schemas --strict --dry-run gnome-extension/schemas

      # pwsh is preinstalled on ubuntu runners, so the Windows entry points get
      # parsed here even though the project is developed on Linux.
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse |
            Where-Object { $_.FullName -notmatch 'llama\.cpp' } |
            ForEach-Object {
              Write-Host "checking $($_.FullName)"
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                $failed = $true
                $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              }
            }
          if ($failed) { exit 1 }

      - name: Check version is single-sourced
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = pyproject["project"]["version"]
          print(f"pyproject version: {version}")
          lockfile = tomllib.loads(pathlib.Path("uv.lock").read_text(encoding="utf-8"))
          locked = next(p for p in lockfile["package"] if p["name"] == pyproject["project"]["name"])
          if locked["version"] != version:
              sys.exit("uv.lock package version does not match pyproject.toml")
          # app/main.py must not pin a literal version; it reads package metadata.
          main = pathlib.Path("app/main.py").read_text(encoding="utf-8")
          if re.search(r'version\s*=\s*"\d+\.\d+', main):
              sys.exit("app/main.py hardcodes a version; it should read importlib.metadata instead")
          PY

  # The overlay client targets net8.0-windows with WPF, which cannot be built on
  # Linux at all -- without this job nothing type-checks its C# before someone
  # runs dotnet on their own machine.
  overlay-client:
    name: overlay-client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the WPF overlay client
        run: dotnet build windows/OverlayClient/OverlayClient.csproj -c Release --nologo
